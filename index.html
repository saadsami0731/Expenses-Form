<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قائمة مصاريف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf7;
    --paper-line: #ebe7dd;
    --accent: #8b1e1e;
    --accent-soft: #f4e8e8;
    --muted: #6b6b6b;
    --gold: #b8923a;
    --design: #c3303a;          /* mid red (anchor color, used for solid borders/accents) */
    --design-light: #e85767;    /* lighter red (used for gradient end) */
    --design-soft: #fde0e3;     /* very light tint of --design for backgrounds */
    --design-line: #f0a8ae;     /* tint for thin borders */
    --design-gradient: linear-gradient(135deg, #c3303a 0%, #e85767 100%);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 12px 40px rgba(26,26,26,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #e8e6df;
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(139,30,30,0.04) 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(184,146,58,0.06) 0%, transparent 40%);
    padding: 32px 16px 60px;
  }

  /* ===== Top bar (hidden in print) ===== */
  .toolbar {
    max-width: 820px;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
  }

  .toolbar h1 {
    font-family: 'Tajawal', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  .toolbar h1 span {
    color: var(--design);
  }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-primary {
    background: var(--design-gradient);
    color: white;
  }
  .btn-primary:hover { filter: brightness(0.93); transform: translateY(-1px); }

  .btn-large {
    font-size: 16px;
    padding: 14px 32px;
    gap: 8px;
    border-radius: var(--radius-md);
  }

  .bottom-actions {
    max-width: 820px;
    margin: 24px auto 0;
    display: flex;
    justify-content: center;
  }

  .btn-ghost {
    background: transparent;
    color: var(--design);
    border: 1px solid var(--design-line);
  }
  .btn-ghost:hover { background: var(--design-soft); color: var(--design); }

  /* ===== Paper ===== */
  .paper {
    max-width: 820px;
    margin: 0 auto;
    background: var(--paper);
    padding: 56px 60px 48px;
    box-shadow: var(--shadow);
    position: relative;
    border-radius: var(--radius-lg);
  }

  .paper::before {
    content: "";
    position: absolute;
    inset: 12px;
    border: 1px solid var(--design-line);
    pointer-events: none;
    border-radius: var(--radius-md);
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--design);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  .header-title h2 {
    font-family: 'Tajawal', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -1px;
  }

  .header-title .subtitle {
    font-family: 'Tajawal', sans-serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 4px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  .header-meta {
    text-align: left;
    direction: ltr;
  }

  .meta-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
    font-weight: 500;
  }

  .meta-value {
    font-family: 'Inter', 'Tajawal', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--design);
  }

  /* ===== Table ===== */
  .table-wrap {
    margin-bottom: 24px;
  }

  table.expense-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 15px;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--design-line);
  }

  .expense-table thead {
    background: var(--design-gradient);
  }

  .expense-table thead th {
    background: transparent;
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 14px;
    text-align: right;
    letter-spacing: 0.5px;
  }

  .expense-table thead th.amount-col {
    text-align: center;
    width: 180px;
  }

  .amount-cell {
    padding: 0;
  }

  .amount-wrap {
    display: flex;
    align-items: stretch;
    width: 100%;
  }

  .amount-wrap .amount-input {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding-left: 4px;
    padding-right: 4px;
  }

  .currency-toggle {
    flex-shrink: 0;
    border: none;
    background: var(--design-soft);
    color: var(--design);
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 0 10px;
    cursor: pointer;
    min-width: 50px;
    transition: background 0.15s, color 0.15s;
    border-right: 1px solid var(--design-line);
  }

  .currency-toggle:hover {
    background: var(--design);
    color: white;
  }

  .currency-toggle.is-usd {
    background: #d6e8dc;
    color: #2d4a3a;
    font-size: 16px;
    font-family: 'Tajawal', sans-serif;
  }

  .currency-toggle.is-usd:hover {
    background: #c1ddca;
  }

  .expense-table thead th.action-col {
    width: 56px;
    background: transparent;
  }

  .expense-table tbody tr {
    transition: background 0.15s;
  }
  .expense-table tbody tr:hover {
    background: rgba(201,122,106,0.04);
  }

  .expense-table tbody td {
    padding: 0;
    vertical-align: middle;
    border-bottom: 1px solid var(--paper-line);
  }
  .expense-table tbody tr:last-child td {
    border-bottom: none;
  }

  .cell-input {
    width: 100%;
    border: none;
    background: transparent;
    padding: 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }

  /* Make the details textarea behave like an inline cell */
  textarea.details-input {
    resize: none;
    overflow: hidden;
    line-height: 1.5;
    min-height: 50px;
    display: block;
    vertical-align: middle;
    box-sizing: border-box;
  }

  /* Print-only mirror element for textarea content (set up in JS) */
  .details-print-mirror {
    display: none;
    padding: 6pt 7pt !important;
    font-family: 'Tajawal', sans-serif !important;
    font-size: 11pt !important;
    font-weight: 400 !important;
    line-height: 1.4 !important;
    color: var(--ink) !important;
    white-space: pre-wrap !important;
    word-wrap: break-word !important;
    -webkit-text-size-adjust: none !important;
    text-size-adjust: none !important;
  }

  .cell-input:focus {
    background: var(--design-soft);
  }

  .amount-input {
    text-align: center;
    font-family: 'Inter', 'Tajawal', sans-serif;
    font-weight: 400;
    font-size: 17px;
  }

  /* hide arrows on number inputs */
  .amount-input::-webkit-outer-spin-button,
  .amount-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .amount-input { -moz-appearance: textfield; }

  .row-num {
    width: 44px;
    text-align: center;
    padding: 10px 6px;
    font-family: 'Inter', 'Tajawal', sans-serif;
    color: white;
    font-size: 13px;
    font-weight: 600;
    vertical-align: middle;
  }

  /* Wrap the number itself in a glass-style circle via ::before */
  .row-num::before {
    content: attr(data-num);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(135deg, #e85767 0%, #f0808d 100%);
    color: white;
    font-size: 12px;
    font-weight: 700;
    box-shadow:
      0 2px 4px rgba(195,48,58,0.25),
      inset 0 1px 1px rgba(255,255,255,0.4),
      inset 0 -1px 1px rgba(195,48,58,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .expense-table tbody tr:hover .row-num::before {
    transform: scale(1.08);
    box-shadow:
      0 3px 8px rgba(195,48,58,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5),
      inset 0 -1px 1px rgba(195,48,58,0.2);
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }
  .delete-btn:hover {
    background: var(--design);
    color: white;
  }

  .add-row {
    margin-top: 14px;
    background: transparent;
    border: 1.5px dashed var(--design-line);
    color: var(--muted);
    padding: 12px;
    width: 100%;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.15s;
  }
  .add-row:hover {
    border-color: var(--design);
    color: var(--design);
    background: var(--design-soft);
  }

  /* ===== Total ===== */
  .total-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 2px solid var(--design);
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 12px 16px;
    background: var(--design-gradient);
    color: white;
    border-radius: var(--radius-md);
    margin-bottom: 8px;
  }

  .total-row-usd {
    background: linear-gradient(135deg, #4a7361 0%, #7ba896 100%);
  }

  /* dim the USD row on screen when no USD entries */
  .total-row-usd.zero-amount {
    opacity: 0.45;
  }

  .total-label {
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
    flex: 1;
    line-height: 1.5;
  }

  .total-label-screen {
    display: inline;
  }

  .total-label-prefix {
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fde9e2;
    margin-left: 6px;
  }

  .total-row-usd .total-label-prefix {
    color: #e0ede5;
  }

  .total-label-words {
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 700;
  }

  .total-label-suffix {
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #fde9e2;
    opacity: 0.85;
    margin-right: 4px;
  }

  .total-row-usd .total-label-suffix {
    color: #e0ede5;
  }

  .total-value {
    font-family: 'Inter', 'Tajawal', sans-serif;
    font-size: 26px;
    font-weight: 400;
    color: #fde9e2;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .total-row-usd .total-value {
    color: #e0ede5;
  }

  .total-label-print { display: none; }

  /* ===== Footer (signature) ===== */
  .footer {
    margin-top: 56px;
  }

  .name-block {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 480px;
  }

  .name-label {
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    white-space: nowrap;
  }

  .name-box {
    flex: 1;
    border: 2px solid var(--design);
    background: white;
    padding: 12px 16px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 18px;
    text-align: right;
    color: var(--ink);
    outline: none;
    border-radius: var(--radius-md);
    transition: all 0.15s;
    cursor: text;
    min-height: 48px;
  }

  .name-box:hover {
    border-color: #b56556;
  }

  .name-box:focus {
    border-color: #b56556;
    box-shadow: 0 0 0 3px var(--design-soft);
  }

  .name-box::placeholder {
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
    opacity: 0.6;
  }

  /* ===== Print ===== */
  @media print {
    /* Neutralize design colors in print — pure black/gray/white for ink savings */
    :root {
      --design: #000 !important;
      --design-light: #000 !important;
      --design-soft: transparent !important;
      --design-line: #000 !important;
      --design-gradient: none !important;
      --accent: #000 !important;
      --accent-soft: transparent !important;
      --gold: #000 !important;
    }
    @page {
      size: A4;
      margin: 12mm;
    }
    html, body {
      background: white;
      padding: 0;
      margin: 0;
      min-height: 0 !important;
      height: auto;
    }
    /* Kill all box-shadows in print to prevent color bleed/shadows on paper */
    * {
      box-shadow: none !important;
    }
    .toolbar { display: none !important; }
    .bottom-actions { display: none !important; }
    .paper {
      box-shadow: none !important;
      max-width: 100% !important;
      padding: 16pt 20pt !important;
      border-radius: 0 !important;
      border: none !important;
      box-sizing: border-box !important;
      page-break-after: avoid;
      page-break-inside: avoid;
    }
    .paper::before { display: none !important; }
    .add-row, .delete-btn, .row-num { display: none !important; }
    .expense-table thead th.action-col,
    .expense-table tbody td.action-cell,
    .expense-table thead th.num-col,
    .expense-table tbody td.num-cell {
      display: none !important;
    }
    .expense-table tbody tr.empty-row {
      display: none;
    }

    /* Hide USD total row & words when no USD expenses */
    .total-row-usd.zero-amount,
    .words-row-usd.zero-amount {
      display: none !important;
    }

    /* Currency toggle becomes plain text in print */
    .currency-toggle {
      background: transparent !important;
      border: none !important;
      padding: 0 6px !important;
      font-family: 'Tajawal', sans-serif !important;
      font-size: 10pt !important;
      font-weight: 700 !important;
      color: var(--ink) !important;
      cursor: default !important;
      min-width: 0 !important;
    }
    .amount-wrap {
      align-items: baseline !important;
      flex-direction: row !important;
      gap: 0 !important;
    }
    .amount-wrap .amount-input {
      flex: 1 !important;
      min-width: 0 !important;
      text-align: center !important;
      padding: 6pt 3pt !important;
      font-size: 11pt !important;
      font-weight: 400 !important;
    }

    /* === Header: date on top-right, title centered === */
    .header {
      display: block !important;
      border-bottom: none !important;
      padding-bottom: 0 !important;
      margin-bottom: 14pt !important;
      flex-direction: row !important;
      gap: 0 !important;
    }
    .header-meta {
      text-align: right !important;
      direction: rtl !important;
      margin-bottom: 9pt !important;
    }
    .meta-label { display: none !important; }
    .meta-value {
      font-family: 'Inter', 'Tajawal', sans-serif !important;
      font-size: 11pt !important;
      font-weight: 400 !important;
      color: var(--ink) !important;
    }
    .meta-value::before {
      content: "التاريخ : ";
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
    }
    .header-title {
      text-align: center !important;
    }
    .header-title h2 {
      font-size: 22pt !important;
      font-weight: 900 !important;
      display: inline-block !important;
      border-bottom: 2px solid var(--ink) !important;
      padding-bottom: 4pt !important;
      margin-bottom: 14pt !important;
      line-height: 1.1 !important;
    }
    .header-title .subtitle { display: none !important; }

    /* === Unified rounded table+totals frame === */
    .print-frame {
      border: 1px solid #000;
      border-radius: 8pt;
      overflow: hidden;
      margin-bottom: 4pt;
      box-shadow: none !important;
      outline: none !important;
    }
    /* Remove all spacing between table and totals inside the frame */
    .print-frame .table-wrap {
      margin: 0 !important;
      padding: 0 !important;
    }
    .print-frame .total-section {
      margin: 0 !important;
      padding: 0 !important;
    }
    /* Kill any residual shadow/outline on the table itself */
    table.expense-table,
    .expense-table thead,
    .expense-table tbody,
    .expense-table tr,
    .expense-table th,
    .expense-table td {
      box-shadow: none !important;
      outline: none !important;
    }

    /* === Table: inner cells only — outer border comes from .print-frame === */
    .expense-table {
      table-layout: fixed;
      border: none !important;
      font-size: 10pt !important;
    }
    .expense-table thead {
      background: transparent !important;
    }
    .expense-table thead th {
      background: #ececec !important;
      color: var(--ink) !important;
      border: none !important;
      border-bottom: 1px solid #000 !important;
      text-align: center !important;
      padding: 6pt 5pt !important;
      font-size: 10pt !important;
      font-weight: 700 !important;
      letter-spacing: 0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    /* Vertical divider between table header cells */
    .expense-table thead th + th {
      border-right: 1px solid #000 !important;
    }
    .expense-table tbody td {
      border: none !important;
      border-bottom: 1px solid #000 !important;
    }
    /* Remove bottom border from last visible row to avoid double line with total-row top border */
    .expense-table tbody tr.last-visible-row td {
      border-bottom: none !important;
    }
    /* Vertical divider between body cells (matches header) */
    .expense-table tbody td + td {
      border-right: 1px solid #000 !important;
    }
    .expense-table tbody tr {
      border: none;
    }
    .cell-input {
      border: none !important;
      padding: 6pt 7pt !important;
      font-size: 11pt !important;
      font-weight: 400 !important;
    }
    /* In print, the textarea is replaced by .details-print-mirror via JS.
       This rule is a fallback for browsers that don't fire beforeprint. */
    textarea.details-input {
      overflow: visible !important;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      resize: none !important;
      min-height: 0 !important;
      height: auto !important;
    }
    .cell-input:focus {
      background: transparent !important;
    }
    /* Amount column compact (right in RTL), details fills the rest */
    .expense-table thead th.amount-col,
    .expense-table tbody td.amount-cell {
      width: 22% !important;
    }
    .expense-table thead th:nth-child(3),  /* details header */
    .expense-table tbody td:nth-child(3) { /* details cell */
      width: 78% !important;
    }

    /* === Total row (2 cells matching: amount-col | details-col) === */
    .total-section {
      margin-top: 0 !important;
      padding-top: 0 !important;
      border-top: none !important;
    }
    .total-row {
      display: table !important;
      table-layout: fixed !important;
      width: 100% !important;
      background: #ececec !important;
      color: var(--ink) !important;
      border: none !important;
      border-radius: 0 !important;
      margin-bottom: 0 !important;
      padding: 0 !important;
      direction: rtl !important;
      flex-direction: row !important;
      gap: 0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    /* IQD row has a top border to clearly separate from the last data row */
    .total-row-iqd {
      border-top: 1px solid #000 !important;
    }
    /* When USD row is visible, give it a top border to separate from IQD */
    .total-row-usd:not(.zero-amount) {
      border-top: 1px solid #000 !important;
    }
    .total-row > * {
      display: table-cell !important;
      vertical-align: middle !important;
      padding: 7pt 9pt !important;
    }
    /* In print, place number cell first (right) under amount col, label cell second (left) */
    .total-value {
      width: 22% !important;
      text-align: center !important;
      font-family: 'Inter', 'Tajawal', sans-serif !important;
      font-size: 12pt !important;
      font-weight: 400 !important;
      color: var(--ink) !important;
      border-left: 1px solid #000 !important;
    }
    .total-row-usd .total-value {
      color: var(--ink) !important;
    }
    .total-value::after {
      content: " " attr(data-currency-symbol);
      font-size: 10pt;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
    }
    .total-label {
      width: 78% !important;
      text-align: right !important;
      font-family: 'Tajawal', sans-serif !important;
      font-size: 10.5pt !important;
      font-weight: 700 !important;
      color: var(--ink) !important;
      letter-spacing: 0 !important;
      line-height: 1.4 !important;
    }
    .total-label-screen { display: none !important; }
    .total-label-print { display: inline !important; font-size: 10.5pt !important; }

    /* hide the separate words row in print — words go inline with total */
    .words-row { display: none !important; }

    /* === Name & signature: no border in print === */
    .name-block {
      flex-direction: row !important;
      gap: 8pt !important;
    }
    .name-label {
      font-size: 12pt !important;
      font-weight: 700 !important;
      font-family: 'Tajawal', sans-serif !important;
    }
    .name-box {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      padding: 4pt 0 !important;
      font-size: 12pt !important;
      font-weight: 700 !important;
      font-family: 'Tajawal', sans-serif !important;
      min-height: 0 !important;
    }
    .footer {
      margin-top: 36pt !important;
    }
  }

  /* ===== Responsive: tablet ===== */
  @media (max-width: 720px) {
    body { padding: 16px 10px 40px; }
    .toolbar {
      margin: 0 auto 12px;
      gap: 8px;
    }
    .toolbar h1 { font-size: 18px; }
    .btn {
      padding: 9px 14px;
      font-size: 13px;
    }
    .paper {
      padding: 28px 20px 32px;
    }
    .paper::before { inset: 8px; }
    .header { gap: 14px; }
    .header-title h2 { font-size: 28px; }
    .header-title .subtitle { letter-spacing: 2px; font-size: 11px; }
    .meta-value { font-size: 16px; }
  }

  /* ===== Responsive: phone ===== */
  @media (max-width: 480px) {
    body {
      padding: 10px 6px 32px;
      font-size: 14px;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 10px;
    }
    .toolbar h1 {
      font-size: 16px;
      text-align: center;
    }
    .actions {
      justify-content: center;
      gap: 6px;
    }
    .btn {
      padding: 10px 14px;
      font-size: 13px;
      flex: 1;
      justify-content: center;
    }
    .btn-large {
      flex: none;
      width: 100%;
      font-size: 15px;
      padding: 14px 24px;
    }
    .bottom-actions {
      margin-top: 18px;
      padding: 0 4px;
    }
    .paper {
      padding: 18px 12px 22px;
    }
    .paper::before { inset: 5px; }

    /* Header */
    .header {
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .header-title { text-align: center; }
    .header-title h2 { font-size: 24px; line-height: 1.1; }
    .header-title .subtitle { font-size: 10px; letter-spacing: 2px; margin-top: 4px; }
    .header-meta { text-align: center; direction: rtl; }
    .meta-label { font-size: 10px; letter-spacing: 1.5px; }
    .meta-value { font-size: 15px; }

    /* Table — change from fixed-grid to compact layout */
    .expense-table {
      font-size: 13px;
    }
    .expense-table thead th {
      padding: 8px 6px;
      font-size: 12px;
      letter-spacing: 0;
    }
    .expense-table thead th.amount-col {
      width: 130px;
    }
    .expense-table thead th.action-col {
      width: 36px;
    }
    .row-num {
      width: 22px;
      font-size: 10px;
      padding: 10px 2px;
    }
    .cell-input {
      padding: 10px 8px;
      font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
    }
    .amount-input {
      font-size: 16px;
      padding: 10px 4px !important;
    }
    .amount-wrap .amount-input {
      padding-left: 2px;
      padding-right: 2px;
    }
    .currency-toggle {
      min-width: 42px;
      padding: 0 6px;
      font-size: 12px;
    }
    .currency-toggle.is-usd {
      font-size: 14px;
    }
    .delete-btn {
      width: 26px;
      height: 26px;
      font-size: 16px;
    }

    .add-row {
      padding: 10px;
      font-size: 13px;
      margin-top: 10px;
    }

    /* Totals */
    .total-section {
      margin-top: 18px;
      padding-top: 14px;
    }
    .total-row {
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 10px 12px;
    }
    .total-label {
      font-size: 13px;
      line-height: 1.4;
    }
    .total-label-prefix { font-size: 11px; letter-spacing: 0; }
    .total-label-words { font-size: 13px; }
    .total-label-suffix { font-size: 11px; }
    .total-value {
      font-size: 22px;
    }

    /* Footer / name */
    .footer {
      margin-top: 28px;
    }
    .name-block {
      flex-direction: row;
      gap: 8px;
    }
    .name-label {
      font-size: 15px;
    }
    .name-box {
      font-size: 15px;
      padding: 10px 12px;
      min-height: 42px;
    }
  }

  /* Very narrow phones */
  @media (max-width: 360px) {
    .paper { padding: 14px 8px 20px; }
    .header-title h2 { font-size: 22px; }
    .expense-table thead th.amount-col { width: 118px; }
    .currency-toggle { min-width: 38px; font-size: 11px; }
    .cell-input { padding: 9px 6px; }
    /* keep input font-size at 16px to prevent iOS zoom */
  }
</style>
</head>
<body>

<div class="paper">
  <header class="header">
    <div class="header-title">
      <h2>قائمة مصاريف</h2>
      <div class="subtitle">EXPENSE REPORT</div>
    </div>
    <div class="header-meta">
      <div class="meta-label">التاريخ · DATE</div>
      <div class="meta-value" id="dateDisplay"></div>
    </div>
  </header>

  <div class="print-frame">
    <div class="table-wrap">
      <table class="expense-table">
        <thead>
          <tr>
            <th class="num-col" style="width:36px"></th>
            <th class="amount-col">المبلغ</th>
            <th>التفاصيل</th>
            <th class="action-col"></th>
          </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
      </table>
      <button class="add-row" onclick="addRow()">+ إضافة صف</button>
    </div>

    <div class="total-section">
      <div class="total-row total-row-iqd">
        <span class="total-value" id="totalDisplayIQD" data-currency-symbol="دينار">0</span>
        <span class="total-label">
          <span class="total-label-screen">
            <span class="total-label-prefix">المجموع بالدينار:</span>
            <span class="total-label-words" id="wordsDisplayIQD">صفر دينار</span>
            <span class="total-label-suffix">لا غير</span>
          </span>
          <span class="total-label-print" id="wordsDisplayPrintIQD">المجموع صفر دينار لا غير</span>
        </span>
      </div>
      <div class="total-row total-row-usd" id="totalRowUSD">
        <span class="total-value" id="totalDisplayUSD" data-currency-symbol="$">0</span>
        <span class="total-label">
          <span class="total-label-screen">
            <span class="total-label-prefix">المجموع بالدولار:</span>
            <span class="total-label-words" id="wordsDisplayUSD">صفر دولار</span>
            <span class="total-label-suffix">لا غير</span>
          </span>
          <span class="total-label-print" id="wordsDisplayPrintUSD">المجموع صفر دولار لا غير</span>
        </span>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="name-block">
      <span class="name-label">الاسم والتوقيع :</span>
      <input type="text" class="name-box" id="nameInput" placeholder="اكتب اسمك">
    </div>
  </footer>
</div>

<div class="bottom-actions">
  <button class="btn btn-primary btn-large" onclick="window.print()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
      <polyline points="6 9 6 2 18 2 18 9"></polyline>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
      <rect x="6" y="14" width="12" height="8"></rect>
    </svg>
    طباعة
  </button>
</div>

<script>
  // ===== Date =====
  function formatDate(d) {
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    return `${dd} / ${mm} / ${yyyy}`;
  }
  document.getElementById('dateDisplay').textContent = formatDate(new Date());

  // ===== Rows =====
  let rowCounter = 0;
  const rowsBody = document.getElementById('rowsBody');

  function addRow(focus = true) {
    rowCounter++;
    const tr = document.createElement('tr');
    tr.dataset.id = rowCounter;
    tr.innerHTML = `
      <td class="num-cell row-num"></td>
      <td class="amount-cell">
        <div class="amount-wrap">
          <input type="text" inputmode="decimal" class="cell-input amount-input" placeholder="0">
          <button type="button" class="currency-toggle" data-currency="IQD" title="تبديل العملة">دينار</button>
        </div>
      </td>
      <td><textarea rows="1" class="cell-input details-input" placeholder="وصف المصروف..."></textarea></td>
      <td class="action-cell"><button type="button" class="delete-btn" title="حذف">×</button></td>
    `;
    rowsBody.appendChild(tr);

    // wire up
    const detailsInput = tr.querySelector('.details-input');
    const amountInput = tr.querySelector('.amount-input');
    const currencyToggle = tr.querySelector('.currency-toggle');
    const deleteBtn = tr.querySelector('.delete-btn');

    // Helper: parse the displayed (possibly comma-formatted) value to a Number
    function parseAmount(str) {
      if (!str) return NaN;
      // Remove commas, keep digits and decimal
      const cleaned = str.replace(/,/g, '').replace(/[^\d.]/g, '');
      const parts = cleaned.split('.');
      const normalized = parts.length > 2
        ? parts[0] + '.' + parts.slice(1).join('')
        : cleaned;
      const n = parseFloat(normalized);
      return isNaN(n) ? NaN : n;
    }

    // Format with thousand separators while preserving in-progress decimal input
    function formatAmount(str) {
      // Extract clean digits + (optional) decimal
      const cleaned = str.replace(/,/g, '').replace(/[^\d.]/g, '');
      const parts = cleaned.split('.');
      const intPart = parts[0] || '';
      const decPart = parts.length > 1 ? parts.slice(1).join('').slice(0, 2) : null; // max 2 dp
      const intFormatted = intPart === ''
        ? ''
        : Number(intPart).toLocaleString('en-US');
      if (decPart === null) {
        // user is not in decimal mode
        return intFormatted;
      }
      // decimal mode (string ends with "." or has digits after)
      return intFormatted + '.' + decPart;
    }

    amountInput.addEventListener('input', (e) => {
      const cursorAtEnd = e.target.selectionStart === e.target.value.length;
      const formatted = formatAmount(e.target.value);
      e.target.value = formatted;
      if (cursorAtEnd) {
        // place cursor at end after reformat
        e.target.setSelectionRange(formatted.length, formatted.length);
      }
      updateTotal();
      updateEmptyMarkers();
    });

    // store parser so updateTotal can use it
    tr._parseAmount = parseAmount;

    currencyToggle.addEventListener('click', () => {
      const current = currencyToggle.dataset.currency;
      if (current === 'IQD') {
        currencyToggle.dataset.currency = 'USD';
        currencyToggle.textContent = '$';
        currencyToggle.classList.add('is-usd');
      } else {
        currencyToggle.dataset.currency = 'IQD';
        currencyToggle.textContent = 'دينار';
        currencyToggle.classList.remove('is-usd');
      }
      updateTotal();
    });

    // Auto-resize the details textarea to fit content
    function autoSizeDetails() {
      detailsInput.style.height = 'auto';
      detailsInput.style.height = detailsInput.scrollHeight + 'px';
    }
    detailsInput.addEventListener('input', () => {
      autoSizeDetails();
      updateEmptyMarkers();
    });
    // size once on creation in case it has initial content
    setTimeout(autoSizeDetails, 0);

    deleteBtn.addEventListener('click', () => {
      tr.remove();
      renumberRows();
      updateTotal();
    });

    renumberRows();
    updateEmptyMarkers();
    if (focus) detailsInput.focus();
  }

  function renumberRows() {
    [...rowsBody.querySelectorAll('tr')].forEach((tr, i) => {
      const cell = tr.querySelector('.num-cell');
      cell.setAttribute('data-num', i + 1);
      cell.textContent = '';
    });
  }

  function updateEmptyMarkers() {
    [...rowsBody.querySelectorAll('tr')].forEach(tr => {
      const d = tr.querySelector('.details-input').value.trim();
      const a = tr.querySelector('.amount-input').value.trim();
      if (!d && !a) tr.classList.add('empty-row');
      else tr.classList.remove('empty-row');
    });
  }

  // ===== Total =====
  function updateTotal() {
    let totalIQD = 0;
    let totalUSD = 0;
    rowsBody.querySelectorAll('tr').forEach(tr => {
      const amountInput = tr.querySelector('.amount-input');
      const currencyToggle = tr.querySelector('.currency-toggle');
      if (!amountInput || !currencyToggle) return;
      const v = tr._parseAmount ? tr._parseAmount(amountInput.value) : parseFloat(amountInput.value);
      if (isNaN(v)) return;
      if (currencyToggle.dataset.currency === 'USD') totalUSD += v;
      else totalIQD += v;
    });

    function fmt(n) {
      return n.toLocaleString('en-US', {
        minimumFractionDigits: n % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    document.getElementById('totalDisplayIQD').textContent = fmt(totalIQD);
    document.getElementById('totalDisplayUSD').textContent = fmt(totalUSD);

    const wordsIQD = numberToArabicWords(totalIQD, 'IQD');
    const wordsUSD = numberToArabicWords(totalUSD, 'USD');
    document.getElementById('wordsDisplayIQD').textContent = wordsIQD;
    document.getElementById('wordsDisplayUSD').textContent = wordsUSD;
    document.getElementById('wordsDisplayPrintIQD').textContent = 'المجموع ' + wordsIQD + ' لا غير';
    document.getElementById('wordsDisplayPrintUSD').textContent = 'المجموع ' + wordsUSD + ' لا غير';

    // Mark USD section so print can hide when zero
    const hasUSD = totalUSD > 0;
    document.getElementById('totalRowUSD').classList.toggle('zero-amount', !hasUSD);
  }

  // ===== Number → Arabic words (Iraqi Dinar / فلس) =====
  // Supports 0 through 999,999,999.99
  const ONES = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة',
                'عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر',
                'ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const TENS = ['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const HUNDREDS = ['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];

  function below1000(n) {
    if (n === 0) return '';
    let parts = [];
    const h = Math.floor(n/100);
    const rem = n % 100;
    if (h > 0) parts.push(HUNDREDS[h]);
    if (rem > 0) {
      if (rem < 20) parts.push(ONES[rem]);
      else {
        const o = rem % 10;
        const t = Math.floor(rem/10);
        if (o === 0) parts.push(TENS[t]);
        else parts.push(ONES[o] + ' و' + TENS[t]);
      }
    }
    return parts.join(' و');
  }

  function thousandsWord(n) {
    // n is the count of thousands (1..999)
    if (n === 1) return 'ألف';
    if (n === 2) return 'ألفان';
    if (n >= 3 && n <= 10) return below1000(n) + ' آلاف';
    return below1000(n) + ' ألف';
  }

  function millionsWord(n) {
    if (n === 1) return 'مليون';
    if (n === 2) return 'مليونان';
    if (n >= 3 && n <= 10) return below1000(n) + ' ملايين';
    return below1000(n) + ' مليون';
  }

  function intToWords(n) {
    if (n === 0) return 'صفر';
    let result = [];
    const millions = Math.floor(n / 1000000);
    const thousands = Math.floor((n % 1000000) / 1000);
    const rest = n % 1000;
    if (millions > 0) result.push(millionsWord(millions));
    if (thousands > 0) result.push(thousandsWord(thousands));
    if (rest > 0) result.push(below1000(rest));
    return result.join(' و');
  }

  function numberToArabicWords(num, currency) {
    currency = currency || 'IQD';
    const isUSD = currency === 'USD';
    const mainSingular = isUSD ? 'دولار واحد' : 'دينار واحد';
    const mainDual = isUSD ? 'دولاران' : 'ديناران';
    const mainPlural = isUSD ? 'دولارات' : 'دنانير';
    const mainGeneric = isUSD ? 'دولار' : 'دينار';
    const subSingular = isUSD ? 'سنت واحد' : 'فلس واحد';
    const subDual = isUSD ? 'سنتان' : 'فلسان';
    const subPlural = isUSD ? 'سنتات' : 'فلوس';
    const subGeneric = isUSD ? 'سنت' : 'فلس';

    if (!num || num === 0) return 'صفر ' + mainGeneric;
    const isNegative = num < 0;
    num = Math.abs(num);
    const major = Math.floor(num);
    const minor = Math.round((num - major) * 100);

    let parts = [];
    if (major > 0) {
      let unit;
      if (major === 1) unit = mainSingular;
      else if (major === 2) unit = mainDual;
      else if (major >= 3 && major <= 10) unit = intToWords(major) + ' ' + mainPlural;
      else unit = intToWords(major) + ' ' + mainGeneric;
      parts.push(unit);
    }
    if (minor > 0) {
      let unit;
      if (minor === 1) unit = subSingular;
      else if (minor === 2) unit = subDual;
      else if (minor >= 3 && minor <= 10) unit = intToWords(minor) + ' ' + subPlural;
      else unit = intToWords(minor) + ' ' + subGeneric;
      parts.push(unit);
    }
    let out = parts.join(' و');
    if (isNegative) out = 'سالب ' + out;
    return out;
  }

  // ===== Reset =====
  function resetForm() {
    if (!confirm('هل أنت متأكد من مسح جميع البيانات؟')) return;
    rowsBody.innerHTML = '';
    document.getElementById('nameInput').value = '';
    for (let i = 0; i < 5; i++) addRow(false);
    updateTotal();
  }

  // ===== Init =====
  for (let i = 0; i < 5; i++) addRow(false);
  updateTotal();

  // For perfect print height, swap textareas to spans before print and back after
  function prepareDetailsForPrint() {
    document.querySelectorAll('textarea.details-input').forEach(t => {
      // Save current value/state on the textarea, hide it, and create a print-only span
      t.dataset.printValue = t.value;
      t.style.display = 'none';
      let printSpan = t.parentNode.querySelector('.details-print-mirror');
      if (!printSpan) {
        printSpan = document.createElement('div');
        printSpan.className = 'details-print-mirror';
        t.parentNode.appendChild(printSpan);
      }
      printSpan.textContent = t.value;
      printSpan.style.display = 'block';
    });

    // Mark the last visible (non-empty) row so its bottom border can be hidden in print
    // (avoids double line with total-row-iqd's top border)
    document.querySelectorAll('#rowsBody tr.last-visible-row').forEach(r => r.classList.remove('last-visible-row'));
    const visibleRows = [...document.querySelectorAll('#rowsBody tr')].filter(r => !r.classList.contains('empty-row'));
    if (visibleRows.length > 0) {
      visibleRows[visibleRows.length - 1].classList.add('last-visible-row');
    }
  }
  function restoreDetailsAfterPrint() {
    document.querySelectorAll('textarea.details-input').forEach(t => {
      t.style.display = '';
    });
    document.querySelectorAll('.details-print-mirror').forEach(s => {
      s.style.display = 'none';
    });
    document.querySelectorAll('#rowsBody tr.last-visible-row').forEach(r => r.classList.remove('last-visible-row'));
  }
  window.addEventListener('beforeprint', prepareDetailsForPrint);
  window.addEventListener('afterprint', restoreDetailsAfterPrint);

  // Update date every minute in case form is left open
  setInterval(() => {
    document.getElementById('dateDisplay').textContent = formatDate(new Date());
  }, 60000);
</script>
</body>
</html>
